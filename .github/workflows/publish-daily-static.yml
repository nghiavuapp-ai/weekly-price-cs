name: Publish Daily Static Fallback
run-name: Static Daily ${{ fromJSON(inputs.run_json).run_id }} ${{ inputs.snapshot_sha256 }}

on:
  workflow_dispatch:
    inputs:
      snapshot_gzip_b64:
        description: Gzip/base64 encoded Daily CSV snapshot
        required: true
        type: string
      snapshot_sha256:
        description: SHA-256 of the uncompressed CSV snapshot
        required: true
        type: string
      run_json:
        description: Daily Run Log metadata as JSON
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: daily-static-fallback
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh serialized data base
        run: git pull --ff-only origin main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install converter dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Verify, merge and write static Daily data
        run: >-
          python tools/daily_static_fallback.py
          --event-path "$GITHUB_EVENT_PATH"
          --existing web/public/data/daily-fallback.json
          --output web/public/data/daily-fallback.json
      - name: Commit the generated public data only
        run: |
          if test -z "$(git status --porcelain -- web/public/data/daily-fallback.json)"; then
            echo "Static fallback already contains this exact run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/daily-fallback.json
          git commit -m "chore(data): publish daily static fallback"
          git push origin HEAD:main
