name: Price Check Cloud

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: Price Check run type
        required: true
        type: choice
        options:
          - primary
          - retry
          - weekly
          - shadow

permissions:
  contents: read

concurrency:
  group: price-check-${{ inputs.run_type }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install crawler dependencies
        run: |
          python -m pip install --requirement requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Price Check
        run: python tools/cloud_price_check.py --run-type "${{ inputs.run_type }}"
      - name: Upload crawl evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: price-check-${{ inputs.run_type }}-${{ github.run_id }}
          path: outputs/cloud/
          if-no-files-found: warn
          retention-days: 14

