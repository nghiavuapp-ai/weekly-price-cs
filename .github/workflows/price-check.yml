name: Price Check Cloud

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: Price Check run type
        required: true
        type: choice
        options:
          - primary
          - retry
          - weekly
          - shadow
  schedule:
    # Fixed UTC equivalents; Vietnam does not observe daylight saving time.
    - cron: '0 4 * * *'
    - cron: '30 4 * * *'
    - cron: '0 5 * * 5'
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: price-check-${{ github.event_name == 'schedule' && github.event.schedule || inputs.run_type }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PRICE_FETCH_RELAY_URL: ${{ secrets.PRICE_FETCH_RELAY_URL }}
      PRICE_FETCH_RELAY_TOKEN: ${{ secrets.PRICE_FETCH_RELAY_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Resolve scheduled run type
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RUN_TYPE: ${{ inputs.run_type }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then run_type="$MANUAL_RUN_TYPE"
          elif [ "$SCHEDULE" = "0 4 * * *" ]; then run_type="primary"
          elif [ "$SCHEDULE" = "30 4 * * *" ]; then run_type="retry"
          elif [ "$SCHEDULE" = "0 5 * * 5" ]; then run_type="weekly"
          else run_type="shadow"
          fi
          echo "run_type=$run_type" >> "$GITHUB_OUTPUT"
      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check cloud production gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_TYPE: ${{ steps.plan.outputs.run_type }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            python tools/shadow_gate.py status --run-type "$RUN_TYPE"
          fi
      - name: Set up Node.js
        if: ${{ steps.gate.outputs.allowed == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install crawler dependencies
        if: ${{ steps.gate.outputs.allowed == 'true' }}
        run: |
          python -m pip install --requirement requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Price Check
        if: ${{ steps.gate.outputs.allowed == 'true' }}
        env:
          RUN_TYPE: ${{ steps.plan.outputs.run_type }}
        run: python tools/cloud_price_check.py --run-type "$RUN_TYPE"
      - name: Compare shadow with local Daily reference
        if: ${{ steps.gate.outputs.allowed == 'true' && steps.plan.outputs.run_type == 'shadow' }}
        run: python tools/compare_shadow_to_daily.py --shadow-dir outputs/cloud
      - name: Record shadow quality gate
        if: ${{ steps.gate.outputs.allowed == 'true' && steps.plan.outputs.run_type == 'shadow' }}
        run: python tools/shadow_gate.py record --report "$(find outputs/cloud -name 'shadow-comparison-*.json' -print -quit)"
      - name: Upload crawl evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: price-check-${{ steps.plan.outputs.run_type }}-${{ github.run_id }}
          path: outputs/cloud/
          if-no-files-found: warn
          retention-days: 14
