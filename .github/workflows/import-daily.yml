name: Import Local Daily Price Check

on:
  workflow_dispatch:
    inputs:
      snapshot_gzip_b64:
        description: Gzip/base64 encoded Daily CSV snapshot
        required: true
        type: string
      snapshot_sha256:
        description: SHA-256 of the uncompressed CSV snapshot
        required: true
        type: string
      run_json:
        description: Daily Run Log metadata as JSON
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: import-daily-${{ inputs.snapshot_sha256 }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install importer dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Verify and import Daily snapshot
        run: python tools/import_daily_dispatch.py
